
services:
  habitaciones-api:
    build: .
    container_name: habitaciones-api
    ports:
      - "8001:8001"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root12345
      DB_NAME: db_habitaciones
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: habitaciones-db
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: db_habitaciones
    ports:
      - "3307:3306"
    volumes:
      - habitaciones_data:/var/lib/mysql
      - ./db_habitaciones.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot12345"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  habitaciones_data:
